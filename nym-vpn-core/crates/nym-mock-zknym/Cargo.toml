[package]
name = "nym-mock-zknym"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Ecash zk-nym signer for private-cluster nym-vpn-mock"

[[bin]]
name = "nym-mock-zknym"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

nym-compact-ecash.workspace = true
nym-credential-proxy-requests.workspace = true
nym-credentials.workspace = true
nym-credentials-interface.workspace = true
nym-ecash-time.workspace = true
nym-vpn-api-client = { path = "../nym-vpn-api-client" }
